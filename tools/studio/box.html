// Rendering yields with setTimeout(0), which browsers throttle in hidden tabs; MessageChannel is not throttled.
(function () {
  var ch = new MessageChannel(), q = [], st = window.setTimeout;
  ch.port1.onmessage = function () { var f = q.shift(); if (f) f(); };
  window.setTimeout = function (f, d) { var a = [].slice.call(arguments, 2); if (!d) { q.push(function () { f.apply(null, a); }); ch.port2.postMessage(0); return 0; } return st.apply(window, arguments); };
})();
</script>
